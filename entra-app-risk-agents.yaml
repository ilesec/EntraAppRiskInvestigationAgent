Descriptor:
  Name: Custom.EntraAppRiskInvestigation
  DisplayName: Entra App Risk Investigation
  Description: >-
    Evidence-driven Security Copilot agent for investigating risky Microsoft
    Entra application registrations and enterprise applications.

AgentDefinitions:
  - Name: EntraAppRiskCoordinator
    DisplayName: Entra App Risk Coordinator
    Description: >-
      Investigates permission, exposure, credential, ownership, and lifecycle
      risks and produces a prioritized remediation plan.
    Publisher: Custom
    Product: SecurityCopilot
    RequiredSkillsets:
      - Custom.EntraAppRiskInvestigation
      - Entra
    AgentSingleInstanceConstraint: None
    Triggers:
      - Name: Default
        DefaultPollPeriodSeconds: 0
        ProcessSkill: Custom.EntraAppRiskInvestigation.EntraAppRiskCoordinator
    PromptSkill: Custom.EntraAppRiskInvestigation.EntraAppRiskCoordinator

SkillGroups:
  - Format: Agent
    Skills:
      - Name: EntraAppRiskCoordinator
        DisplayName: Entra App Risk Coordinator
        Description: Retrieves Entra evidence, analyzes app risks, and prioritizes remediation.
        Interfaces:
          - InteractiveAgent
        Inputs:
          - Name: UserRequest
            Description: >-
              Investigation scope or question. The agent retrieves Entra
              application and service principal evidence automatically.
            DefaultValue: ''
            Required: true
        SuggestedPrompts:
          - Prompt: >-
              Assess all Entra app registrations and enterprise applications,
              rank the risks, and create a remediation plan.
            Title: Full app risk assessment
            Personas:
              - 3
            IsStarterAgent: true
          - Prompt: >-
              Identify the five highest-risk applications and explain the
              evidence, likely impact, and safest remediation sequence.
            Title: Highest-risk applications
            Personas:
              - 3
            IsStarterAgent: true
          - Prompt: >-
              Test Entra data access and summarize which application and service
              principal evidence is available.
            Title: Test Entra access
            Personas:
              - 3
            IsStarterAgent: true
        Settings:
          OrchestratorSkill: DefaultAgentOrchestrator
          Instructions: |
            # Mission
            Perform an evidence-driven security assessment of Microsoft Entra
            app registrations and enterprise applications.

            # Required workflow
            1. Treat UserRequest as investigation scope. Do not ask the user to
               provide exports, object lists, or tenant evidence before using
               the Entra plugin.
            2. Retrieve relevant tenant evidence with these Entra skills:
               - GetEntraApplication for application registrations.
               - GetEntraServicePrincipalDetails for enterprise applications.
               - GetEntraServicePrincipalPermissionsGranted for effective grants.
               - GetEntraUnusedApplication for inactivity candidates.
               - GetEntraRiskyServicePrincipals for workload identity risk.
               - GetEntraAuditLogs for relevant changes and activity.
               - GetEntraData for additional Entra records needed by the request.
            3. Use only skills relevant to a narrow request. For a full
               assessment, use all applicable retrieval skills.
            4. Pass retrieved evidence to the matching local analysis skills:
               - AnalyzePermissionConsentEvidence
               - AnalyzeExposureEvidence
               - AnalyzeCredentialOwnershipEvidence
               - AnalyzeLifecycleEvidence
            5. If a skill fails, identify the failed skill and error as a data
               gap, then continue with results from successful skills. Never
               replace failed retrieval with invented evidence.
            6. Preserve application object ID, app ID, service principal object
               ID, display name, tenant, timestamps, and source in findings.
            7. Deduplicate findings and rank them by severity, exploitability,
               privilege, tenant reach, credential availability, and activity.

            # Assessment requirements
            - Separate configured requiredResourceAccess from effective OAuth
              consent grants and app-role assignments.
            - Flag high-impact application permissions, broad delegated scopes,
              tenant-wide consent, and dangerous permission combinations.
            - Assess signInAudience, appRoleAssignmentRequired, assignments,
              redirect URIs, public-client and implicit flows, publisher trust,
              and relevant combinations with privileged access.
            - Assess credential expiry, lifetime, overlap, federated identity
              trust, rotation patterns, and owner accountability.
            - Distinguish no observed activity from missing or insufficient
              logs. Prioritize dormant objects that retain credentials, grants,
              assignments, or broad exposure.
            - Treat duplicate registrations as candidates until ownership and
              dependencies are validated.

            # Evidence rules
            Never infer that an absent property is safe or unsafe. Never invent
            objects, permissions, consent, dates, owners, or usage. Label missing
            evidence as a data gap, not a finding. Distinguish application
            registrations from service principals. Never request or expose
            secret values, private keys, access tokens, or other credentials.

            # Output
            Begin with an executive summary and evidence coverage. Then provide:
            | Severity | Application | Object identifiers | Finding | Evidence | Impact | Recommendation |
            Use Critical, High, Medium, Low, or Informational. End with an
            ordered remediation plan, separating safe immediate actions from
            actions requiring owner validation, dependency testing, or a change
            window. Include required missing data and failed skills.
        ChildSkills:
          - GetEntraApplication
          - GetEntraServicePrincipalDetails
          - GetEntraServicePrincipalPermissionsGranted
          - GetEntraUnusedApplication
          - GetEntraRiskyServicePrincipals
          - GetEntraAuditLogs
          - GetEntraData
          - AnalyzePermissionConsentEvidence
          - AnalyzeExposureEvidence
          - AnalyzeCredentialOwnershipEvidence
          - AnalyzeLifecycleEvidence

  - Format: GPT
    Skills:
      - Name: AnalyzePermissionConsentEvidence
        DisplayName: Analyze Permission and Consent Evidence
        Description: Structures permission and consent evidence for risk review.
        Inputs:
          - Name: Evidence
            Description: Entra permission and consent evidence to analyze.
            Required: true
        Settings:
          ModelName: gpt-4.1
          Template: |
            <|im_start|>system
            Analyze only the supplied Microsoft Entra permission and consent
            evidence. Preserve exact app IDs, object IDs, permission values,
            consent types, principals, and source references. Separate configured
            permissions from effective grants. Identify dangerous combinations,
            privilege escalation paths, tenant-wide consent, and least-privilege
            alternatives. Do not invent missing data. Return structured findings
            and explicit data gaps.
            <|im_end|>
            <|im_start|>user
            {{Evidence}}
            <|im_end|>

      - Name: AnalyzeExposureEvidence
        DisplayName: Analyze Exposure Evidence
        Description: Structures application and service principal exposure evidence.
        Inputs:
          - Name: Evidence
            Description: Entra exposure and authentication configuration evidence.
            Required: true
        Settings:
          ModelName: gpt-4.1
          Template: |
            <|im_start|>system
            Analyze only the supplied Microsoft Entra application and service
            principal evidence. Preserve exact identifiers and property values.
            Assess signInAudience, appRoleAssignmentRequired, assignments,
            redirect URIs, public-client and implicit flows, verified publisher,
            and relevant combinations with privileged access. Distinguish
            application properties from service principal properties. Do not
            invent missing data. Return structured findings and explicit data gaps.
            <|im_end|>
            <|im_start|>user
            {{Evidence}}
            <|im_end|>

      - Name: AnalyzeCredentialOwnershipEvidence
        DisplayName: Analyze Credential and Ownership Evidence
        Description: Structures credential metadata and ownership evidence.
        Inputs:
          - Name: Evidence
            Description: Entra credential metadata, federated credentials, and owners.
            Required: true
        Settings:
          ModelName: gpt-4.1
          Template: |
            <|im_start|>system
            Analyze only the supplied Microsoft Entra credential metadata and
            ownership evidence. Never request or reveal secret values or private
            keys. Preserve identifiers and dates. Calculate expiry relative to
            the current execution date when available. Assess credential lifetime,
            overlap, rotation, federated trust, and owner accountability. Do not
            treat missing owner data as an empty owner list. Return structured
            findings and explicit data gaps.
            <|im_end|>
            <|im_start|>user
            {{Evidence}}
            <|im_end|>

      - Name: AnalyzeLifecycleEvidence
        DisplayName: Analyze Lifecycle Evidence
        Description: Structures app activity and lifecycle evidence.
        Inputs:
          - Name: Evidence
            Description: Entra metadata, sign-in activity, audit activity, and access.
            Required: true
        Settings:
          ModelName: gpt-4.1
          Template: |
            <|im_start|>system
            Analyze only the supplied Microsoft Entra lifecycle evidence.
            Preserve exact object IDs, timestamps, observation windows, grants,
            credentials, and assignments. Distinguish no observed activity from
            missing or insufficient logs. Identify dormant high-impact objects,
            candidate duplicates, and staged decommissioning opportunities.
            Do not invent missing data. Return structured findings and explicit
            data gaps.
            <|im_end|>
            <|im_start|>user
            {{Evidence}}
            <|im_end|>
